# DATUS_TEST_* configures this container; the POSTGRESQL_* the tests read
# configures the client. See docs/adapter-testing-standard.md.
services:
  postgres:
    image: postgres:16
    environment:
      TZ: UTC
      POSTGRES_DB: ${DATUS_TEST_POSTGRESQL_DATABASE:-test}
      POSTGRES_USER: ${DATUS_TEST_POSTGRESQL_USER:-test_user}
      POSTGRES_PASSWORD: ${DATUS_TEST_POSTGRESQL_PASSWORD:-test_password}
    ports:
      - "${POSTGRESQL_HOST_PORT:-5432}:5432"
    healthcheck:
      # The init server accepts socket connections before setup finishes.
      # Authenticate over TCP, which is enabled only for the final server.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -w -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
